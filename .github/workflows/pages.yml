name: ProfitRendszer műszerfal publikálás

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Forrás letöltése
        uses: actions/checkout@v4
      - name: Pages beállítása
        uses: actions/configure-pages@v5
      - name: Statikus műszerfal csomagolása
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publikálás GitHub Pagesre
        id: deployment
        uses: actions/deploy-pages@v4
